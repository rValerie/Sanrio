<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mundo Sanrio · Guía de personajes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="hero">
    <p class="hero__tag">✨ Guía de personajes ✨</p>
    <h1 class="hero__title">Mundo Sanrio</h1>
    <p class="hero__text">Conoce el cumpleaños, la personalidad y los gustos de tus personajes favoritos.</p>

    <div class="controls">
      <input id="search" class="search" type="search" placeholder="🔍 Buscar personaje..." aria-label="Buscar personaje">
      <div class="filters" id="filters">
        <button class="chip is-active" data-filter="all">Todos</button>
        <button class="chip" data-filter="classic">Clásicos</button>
        <button class="chip" data-filter="modern">Modernos</button>
        <button class="chip" data-filter="favorites">💖 Favoritos</button>
      </div>
    </div>
  </header>

  <main class="main">
    <section id="grid" class="grid" aria-live="polite"></section>
    <p id="empty" class="empty" hidden>No encontramos ningún personaje 🥺</p>
  </main>

  <dialog id="modal" class="modal">
    <button class="modal__close" id="closeModal" aria-label="Cerrar">✕</button>
    <div id="modalContent"></div>
  </dialog>

  <footer class="footer">
    <p>Hecho con 💗 · Datos de referencia, pueden variar según la ficha oficial de Sanrio.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
